name: Poko CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-doxygen

    - name: Configure CMake
      shell: msys2 {0}
      run: |
        cd build
        cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DENGINE_BUILD_TESTS=ON

    - name: Build
      shell: msys2 {0}
      run: |
        cd build
        cmake --build . --config Release

    - name: Run Tests
      shell: msys2 {0}
      run: |
        cd build
        ctest --output-on-failure

    - name: Generate Documentation
      shell: msys2 {0}
      run: |
        cd build
        doxygen ../Doxyfile

    - name: Upload Documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: build/docs/html

  build-android:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup NDK
      run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

    - name: Configure CMake for Android
      run: |
        mkdir build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 -DENGINE_BUILD_TESTS=OFF

    - name: Build for Android
      run: |
        cd build
        cmake --build .

  formatting:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check formatting
      run: |
        echo "Formatting check placeholder - configure clang-format in future"
